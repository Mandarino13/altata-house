- id: n1
  type: note
  title: 'Storm Research: A Systems-Thinking Operating Frame for Solving Any Problem
    (v2 verified)'
  url: file:///Users/gerardolozano/Documents/CODE/Personal/storm-reports/systems-thinking-operating-frame-briefing.html
  tags:
  - systems-thinking
  - decision-making
  - framework
  - research
  - briefing
  - verified
  - storm-research
  - operating-frame
  value: high
  summary: 'Verified research briefing (2026-08-05): 5-lens synthesis (practitioner,
    academic, skeptic, economist, historian) on problem-solving frameworks. All 14
    citations checked against primary sources: 0 fabricated, 8 corrected, 4 demoted.
    Key findings: (1) only calibrated scored decision-making transfers across domains
    (far transfer ~0.03-0.05 SD); (2) the durable core is a diagnostic router matching
    method to problem-type, not the frameworks themselves; (3) Meadows'' leverage
    points - operators push weak ones (numbers) not strong ones (information flows,
    rules, goals); (4) frameworks are near-zero-cost commodities in a ~1B self-dev
    market; (5) design thinking works via psychological empowerment, not method mechanics.
    Build: thin top (router + scored decision journal), cheap swappable bottom (10-15
    patterns). Missing 6th lens: the operator''s own energy/attention is the rate-limiting
    resource.'
  saved_at: '2026-08-30'
